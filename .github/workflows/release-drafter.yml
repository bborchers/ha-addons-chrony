name: Release Drafter

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-drafter:
    uses: bborchers/ha-addons-workflow/.github/workflows/release-drafter.yml@main
    permissions:
      contents: write
      pull-requests: write

  publish-release:
    needs: release-drafter
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether the add-on changed since the last release
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG=$(gh api "repos/${{ github.repository }}/releases" \
            --jq '[.[] | select(.draft == false)][0].tag_name // empty')
          if [ -z "$LAST_TAG" ] || ! git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$LAST_TAG" HEAD | grep -qx "chrony/CHANGELOG.md"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release draft
        if: steps.changed.outputs.changed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DRAFT_TAG=$(gh api "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.draft) | .tag_name' | head -n 1)
          if [ -z "$DRAFT_TAG" ]; then
            echo "No release draft found"
            exit 0
          fi

          gh release edit "$DRAFT_TAG" --repo "${{ github.repository }}" --draft=false
          echo "version=${DRAFT_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Leave the draft open (no add-on changes)
        if: steps.changed.outputs.changed != 'true'
        run: echo "chrony/CHANGELOG.md hasn't changed since the last release; leaving the draft open instead of publishing."

  deploy:
    needs: publish-release
    if: ${{ needs.publish-release.outputs.version != '' }}
    uses: bborchers/ha-addons-workflow/.github/workflows/build-deploy.yml@main
    with:
      addon-path: chrony
      slug: chrony
      version: ${{ needs.publish-release.outputs.version }}
    secrets:
      dispatch-token: ${{ secrets.DISPATCH_TOKEN }}
    permissions:
      contents: read
      packages: write
